name: Build & Deploy
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Docker Image
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate Docker tags
        id: tags
        run: |
          BRANCH="${GITHUB_BASE_REF:-${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}}"
          SAFE_BRANCH="$(echo "$BRANCH" | tr '/' '-')"
          VERSION_TAG="$(date +'%d-%m-%Y')-${SAFE_BRANCH}"
          TAGS="docker.io/woss/woss-io:${VERSION_TAG}"
          if [ "$BRANCH" = "main" ]; then
            TAGS="${TAGS}"$'\n'"docker.io/woss/woss-io:latest"
          fi
          echo "tags<<EOF
          ${TAGS}
          EOF" >> $GITHUB_OUTPUT
          echo "version=${VERSION_TAG}" >> $GITHUB_OUTPUT
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        id: push
        with:
          push: true
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            DD_VERSION=${{ steps.tags.outputs.version }}

  deploy:
    name: Deploy to prod cluster
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-woss-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Enable Agent OTLP log ingestion
        run: |
          agent_json="$(kubectl -n datadog get datadogagent datadog -o json)"
          if ! printf '%s' "$agent_json" | jq -e '.spec.override.nodeAgent.env | type == "array"' >/dev/null; then
            echo "DatadogAgent nodeAgent env override is missing" >&2
            exit 1
          fi
          env_index="$(printf '%s' "$agent_json" | jq -r '[.spec.override.nodeAgent.env[]? | .name] | index("DD_OTLP_CONFIG_LOGS_ENABLED") // empty')"
          if [ -n "$env_index" ]; then
            patch="$(jq -cn --arg path "/spec/override/nodeAgent/env/$env_index/value" '[{op:"replace",path:$path,value:"true"}]')"
          else
            patch='[{"op":"add","path":"/spec/override/nodeAgent/env/-","value":{"name":"DD_OTLP_CONFIG_LOGS_ENABLED","value":"true"}}]'
          fi
          kubectl -n datadog patch datadogagent datadog --type=json --patch "$patch"
          kubectl -n datadog rollout status daemonset/datadog-agent --timeout=300s

      - name: Sync woss-secrets
        env:
          WOSS_PROVIDER_API_KEY: ${{ secrets.WOSS_PROVIDER_API_KEY }}
          WOSS_GITHUB_TOKEN: ${{ secrets.WOSS_GITHUB_TOKEN }}
          WOSS_MCL_MCP_API_KEY: ${{ secrets.WOSS_MCL_MCP_API_KEY }}
          WOSS_MCP_SERVERS: ${{ secrets.WOSS_MCP_SERVERS }}
          WOSS_USER_WEBHOOK_URL: ${{ secrets.WOSS_USER_WEBHOOK_URL }}
          WOSS_USER_WEBHOOK_ERROR_URL: ${{ secrets.WOSS_USER_WEBHOOK_ERROR_URL }}
          WOSS_USER_WEBHOOK_TOKEN: ${{ secrets.WOSS_USER_WEBHOOK_TOKEN }}
        run: |
          kubectl -n woss-prod create secret generic woss-secrets \
            --from-literal=WOSS_PROVIDER_API_KEY="$WOSS_PROVIDER_API_KEY" \
            --from-literal=WOSS_GITHUB_TOKEN="$WOSS_GITHUB_TOKEN" \
            --from-literal=WOSS_MCL_MCP_API_KEY="$WOSS_MCL_MCP_API_KEY" \
            --from-literal=WOSS_MCP_SERVERS="$WOSS_MCP_SERVERS" \
            --from-literal=WOSS_USER_WEBHOOK_URL="$WOSS_USER_WEBHOOK_URL" \
            --from-literal=WOSS_USER_WEBHOOK_ERROR_URL="$WOSS_USER_WEBHOOK_ERROR_URL" \
            --from-literal=WOSS_USER_WEBHOOK_TOKEN="$WOSS_USER_WEBHOOK_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Pin digest and apply manifests
        run: |
          sed -i -e "s/__DIGEST__/${{ needs.build.outputs.digest }}/g" \
            -e "s/__VERSION__/${{ steps.tags.outputs.version }}/g" deploy/deployment.yaml
          kubectl apply -f deploy/pvc.yaml -f deploy/service.yaml -f deploy/deployment.yaml -f deploy/ingress.yaml

      - name: Wait for rollout
        run: kubectl -n woss-prod rollout status deployment/woss --timeout=600s
