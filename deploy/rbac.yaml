# CI deploy identity for the woss.io deploy pipeline.
#
# Applied ONCE by the operator with the admin kubeconfig (context `kelp`).
# CI never applies this file — the CI ServiceAccount token cannot grant
# RBAC rights. See README.md for the full one-time setup.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: woss-deployer
  namespace: tools-img
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: woss-deployer
  namespace: tools-img
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: woss-deployer
  namespace: tools-img
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: woss-deployer
subjects:
  - kind: ServiceAccount
    name: woss-deployer
    namespace: tools-img
---
apiVersion: v1
kind: Secret
metadata:
  name: woss-deployer-token
  namespace: tools-img
  annotations:
    kubernetes.io/service-account.name: woss-deployer
type: kubernetes.io/service-account-token
