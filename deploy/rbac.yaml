# CI deploy identity for the woss.io deploy pipeline.
#
# Applied by the operator with the admin kubeconfig (context `kelp`); reapply
# whenever these permissions change.
# CI never applies this file — the CI ServiceAccount token cannot grant
# RBAC rights. See README.md for the full one-time setup.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: woss-deployer
  namespace: woss-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: woss-deployer
  namespace: woss-prod
rules:
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
  - apiGroups: ['']
    resources: ['services', 'persistentvolumeclaims', 'secrets']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
  - apiGroups: ['networking.k8s.io']
    resources: ['ingresses']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: woss-deployer
  namespace: woss-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: woss-deployer
subjects:
  - kind: ServiceAccount
    name: woss-deployer
    namespace: woss-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: woss-agent-otlp
  namespace: datadog
rules:
  - apiGroups: ['datadoghq.com']
    resources: ['datadogagents']
    resourceNames: ['datadog']
    verbs: ['get', 'patch']
  - apiGroups: ['apps']
    resources: ['daemonsets']
    resourceNames: ['datadog-agent']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: woss-agent-otlp
  namespace: datadog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: woss-agent-otlp
subjects:
  - kind: ServiceAccount
    name: woss-deployer
    namespace: woss-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: woss-deployer-token
  namespace: woss-prod
  annotations:
    kubernetes.io/service-account.name: woss-deployer
type: kubernetes.io/service-account-token
